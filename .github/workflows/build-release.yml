name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Build NanoClip.app
        run: ./Scripts/build-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanoClip-macos-arm64
          path: build/NanoClip.app
          if-no-files-found: error

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/NanoClip.app dist/NanoClip-macos-arm64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/NanoClip-macos-arm64.zip#NanoClip for macOS (Apple Silicon)" --title "$GITHUB_REF_NAME" --generate-notes
